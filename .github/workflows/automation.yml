name: MCP and CLI integration
on:
  pull_request:
    paths:
      - 'automation/**'
      - 'main/**'
      - 'types/**'
      - 'scripts/*automation*'
      - 'package*.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/automation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automation:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 fonts-noto-cjk
      - run: pnpm typecheck
      - run: pnpm build
      - if: runner.os != 'Linux'
        run: pnpm test:automation
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:automation
      - if: runner.os != 'Linux'
        run: pnpm test:automation:desktop
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:automation:desktop
